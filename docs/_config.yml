      - '^https://doi\.org/10\.15168/11572_368265$'
      - '^https://doi\.org/10\.3233/SAT190034$'
      - '^https://doi\.org/10\.3233/SAT190086$'
      - '^https://eprint\.iacr\.org/2020/972\.pdf$'
      - '^https://iris\.unitn\.it/handle/11572/368265$'
