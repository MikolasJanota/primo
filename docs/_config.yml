    myst_heading_anchors: 3
    linkcheck_workers: 4
    linkcheck_timeout: 15
    linkcheck_retries: 1
    linkcheck_rate_limit_timeout: 30
    linkcheck_allow_unauthorized: false
    linkcheck_report_timeouts_as_broken: false
    linkcheck_anchors_ignore_for_url:
      # GitHub implements code-line fragments dynamically; still check the file URL.
      - '^https://github\.com/arminbiere/cadical/blob/rel-3\.0\.0/src/cadical\.hpp$'
      # Known dynamically rendered GitHub fragments; retain file availability checks.
      - '^https://github\.com/arminbiere/cadical/blob/7b99c07/src/cadical\.hpp$'
      - '^https://github\.com/actions/checkout/blob/3d3c42e5aac5ba805825da76410c181273ba90b1/README\.md$'
    linkcheck_ignore:
      # Validated from local Git by make docs-check-links; no GitHub login needed.
      - '^https://github\.com/primo-solver/primo/(?:blob|commit)/'
      # Repository landing page requires access while the repository is private.
      - '^https://github\.com/primo-solver/primo/?$'
      # Exact access-failure exceptions reviewed 2026-11-20 at the owner's request.
      # Evidence: docs/coverage/external-links-20261120.json. Ignored is not validated.
      # Keep DOI citations; do not exempt new targets or HTTP 404 results by category.
      # Observed HTTP 403 access refusals.
      - '^https://doi\.org/10\.1145/1017472\.1017477$'
      - '^https://doi\.org/10\.1145/1670412\.1670413$'
      - '^https://doi\.org/10\.1145/3453483\.3454088$'
      - '^https://doi\.org/10\.1145/357073\.357079$'
